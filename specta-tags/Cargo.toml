[package]
name = "specta-tags"
description = "Analyze Specta datatypes and generate inline JavaScript transforms"
version = "0.0.0"
authors = ["Oscar Beaumont <oscar@otbeaumont.me>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/specta-rs/specta"
documentation = "https://docs.rs/specta-tags/latest/specta-tags"
keywords = ["async", "specta", "rspc", "typescript", "typesafe"]
categories = ["web-programming", "asynchronous"]
readme = "../README.md"

# /bin/sh RUSTDOCFLAGS="--cfg docsrs" cargo +nightly doc --all-features
[package.metadata."docs.rs"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
specta.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }
bytes.workspace = true
chrono.workspace = true
specta = { workspace = true, features = ["derive", "chrono", "bytes"] }
specta-serde.workspace = true
