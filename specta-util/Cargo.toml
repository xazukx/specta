[package]
name = "specta-util"
description = "High-level utilities for working with Specta"
version = "0.0.11"
authors = ["Oscar Beaumont <oscar@otbeaumont.me>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/specta-rs/specta"
documentation = "https://docs.rs/specta-util/latest/specta-util"
keywords = ["async", "specta", "rspc", "typescript", "typesafe"]
categories = ["web-programming", "asynchronous"]
readme = "../README.md"

# /bin/sh RUSTDOCFLAGS="--cfg docsrs" cargo +nightly doc --all-features
[package.metadata."docs.rs"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []

## Support for [serde](https://serde.rs)
serde = ["dep:serde"]

[lints]
workspace = true

[dependencies]
specta.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
