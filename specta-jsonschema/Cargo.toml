[package]
name = "specta-jsonschema"
description = "Export your Rust types to a JSON Schema"
version = "0.0.2"
authors = ["Oscar Beaumont <oscar@otbeaumont.me>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/specta-rs/specta"
documentation = "https://docs.rs/specta-jsonschema/latest/specta-jsonschema"
keywords = ["async", "specta", "rspc", "jsonschema", "typesafe"]
categories = ["web-programming", "asynchronous"]
readme = "../README.md"

# /bin/sh RUSTDOCFLAGS="--cfg docsrs" cargo +nightly doc --all-features
[package.metadata."docs.rs"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[features]
default = []

[dependencies]
specta.workspace = true
schemars.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror.workspace = true

[dev-dependencies]
specta = { workspace = true, features = ["derive", "collect"] }
specta-serde.workspace = true
specta-util = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
insta = { workspace = true, features = ["json"] }
tempfile.workspace = true
